name: Bug report
description: Report a reproducible problem without sharing private account data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Never include passwords, Instagram cookies, `sessionid` values, or private media URLs.
        Security vulnerabilities must be reported through the repository's private vulnerability reporting flow instead.
  - type: input
    id: app-version
    attributes:
      label: App version
      description: "Example: 1.1.3"
      placeholder: 1.1.3
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: url-kind
    attributes:
      label: URL type
      options:
        - Reel URL
        - Individual Story URL
        - Story profile URL
        - Login or session problem
        - Packaging or installation problem
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use a public test URL or redact the username and media ID.
      placeholder: |
        1. Open the app
        2. Paste a redacted URL
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted error message or logs
      description: Remove usernames, URLs, local paths, cookies, tokens, and account information.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested the latest release.
          required: true
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, cookies, and private URLs from this report.
          required: true
